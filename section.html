  const id=new URLSearchParams(location.search).get('id')||'';
  const s=window.storefrontRefresh?await window.storefrontRefresh:await window.storefrontReady;
  const sec=(s.sections||[]).find(x=>x.id===id);
  if(!sec||sec.visible===false){location.replace('index.html');return}
  document.title=(sec.name||'قسم')+' | ورشة تك';
  document.getElementById('sectionKicker').textContent=sec.name||'قسم';
  document.getElementById('sectionTitle').textContent=sec.name||'قسم';
  document.getElementById('sectionDescription').textContent=sec.description||'تصفح محتوى هذا القسم.';
  renderListing(sec.type,'#sectionGrid','#sectionSearch');
});
