<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورشة تك | Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">WT <span>ورشة تك<br><small>Admin</small></span></div><button class="nav active" data-view="dashboard">الرئيسية</button><button class="nav" data-view="products">المنتجات</button><button class="nav" data-view="courses">الدورات</button><button class="nav" data-view="consultations">الاستشارات</button><button class="nav" data-view="settings">الإعدادات</button></aside><main><header><div><h1 id="pageTitle">لوحة التحكم</h1><p>إدارة محتوى متجر ورشة تك</p></div><button class="primary" id="quickAdd">+ إضافة منتج</button></header><section class="view active" id="dashboard"><div class="stats"><div class="card"><small>المنتجات</small><strong id="statProducts">0</strong></div><div class="card"><small>الدورات</small><strong id="statCourses">0</strong></div><div class="card"><small>غير متوفر</small><strong id="statSold">0</strong></div><div class="card"><small>النشطة</small><strong id="statActive">0</strong></div></div><div class="panel"><h2>آخر العناصر</h2><div id="recent"></div></div></section><section class="view" id="products"><div class="panel"><div class="panel-head"><h2>المنتجات</h2><button class="primary" id="addProduct">+ إضافة منتج</button></div><input id="search" placeholder="بحث..."><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>IQD</th><th>USD</th><th>الحالة</th><th>التحكم</th></tr></thead><tbody id="productRows"></tbody></table></div></div></section><section class="view" id="courses"><div class="panel"><div class="panel-head"><h2>الدورات</h2><button class="primary" id="addCourse">+ إضافة دورة</button></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>IQD</th><th>USD</th><th>الحالة</th><th>التحكم</th></tr></thead><tbody id="courseRows"></tbody></table></div></div></section><section class="view" id="consultations"><div class="two"><div class="panel"><h2>استشارة فردية</h2><label>السعر IQD<input id="c1price" type="number"></label><label>الوصف<textarea id="c1desc"></textarea></label><button class="primary" id="saveC1">حفظ</button></div><div class="panel"><h2>باقة الإشراف</h2><label>السعر IQD<input id="c2price" type="number"></label><label>الوصف<textarea id="c2desc"></textarea></label><button class="primary" id="saveC2">حفظ</button></div></div></section><section class="view" id="settings"><div class="panel form-grid"><label>اسم المتجر<input id="storeName"></label><label>Telegram<input id="telegram"></label><label>WhatsApp<input id="whatsapp"></label><label>العملة الافتراضية<select id="currency"><option>IQD</option><option>USD</option></select></label><button class="primary" id="saveSettings">حفظ الإعدادات</button></div></section></main></div><div class="modal" id="modal"><form id="form" class="modal-card"><div class="panel-head"><h2 id="modalTitle">إضافة</h2><button type="button" id="close">×</button></div><input type="hidden" id="editType"><div class="form-grid"><label>الاسم<input id="title" required></label><label>التصنيف<input id="category" required></label><label>السعر IQD<input id="price_iqd" type="number" required></label><label>السعر USD<input id="price_usd" type="number" step="0.01" required></label><label>السعر القديم IQD<input id="old_iqd" type="number"></label><label>السعر القديم USD<input id="old_usd" type="number" step="0.01"></label><label>الحالة<select id="status"><option value="normal">عادي</option><option value="new">جديد</option><option value="sale">خصم</option><option value="sold">نفد</option><option value="featured">مميز</option><option value="coming">قريباً</option></select></label><label>نص الشارة<div style="display:flex;gap:6px"><input id="statusText" readonly style="flex:1"><button type="button" class="mini" id="editStatusText" title="تعديل النص">✎</button></div></label><label class="full">الوصف المختصر<textarea id="short"></textarea></label><label class="full">الوصف الكامل<textarea id="description"></textarea></label><label class="full">المميزات - كل سطر ميزة<textarea id="features"></textarea></label><label class="full">YouTube<input id="youtube"></label><div class="full"><label>صور المنتج<input id="imageInput" type="file" accept="image/*" multiple></label><p class="hint">اختر عدة صور، وبعدها اسحب الصور لترتيبها. أول صورة تعتبر الرئيسية.</p><div id="imageList" class="image-list"></div></div><label class="check full"><input id="active" type="checkbox" checked> يظهر في المتجر</label><div class="full actions"><button type="button" id="cancel">إلغاء</button><button class="primary">حفظ</button></div></div></form></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
