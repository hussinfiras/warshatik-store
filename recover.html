<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استرجاع المشتريات | ورشة تك</title><link rel="stylesheet" href="styles.css?v=20261009-fastfix"><style>
.recover-wrap{max-width:760px;margin:54px auto 70px;padding:0 18px}
.recover-card{background:#fff;border:1px solid #e7e2eb;border-radius:24px;padding:28px;box-shadow:0 18px 60px rgba(55,35,82,.08)}
.recover-card h1{margin:0 0 8px;font-size:30px}.recover-card>p{color:#736b7c;line-height:1.85;margin:0 0 20px}
.recover-card label{display:block;margin:14px 0 7px;font-weight:800}
.recover-card input{width:100%;padding:13px 14px;border:1px solid #ddd5e7;border-radius:13px;background:#fff;font:inherit}
.recover-card button{margin-top:12px}.msg{margin-top:12px;color:#6f6878;line-height:1.7}
.downloads{margin-top:22px;display:grid;gap:12px}.download-box{border:1px solid #e7e2eb;border-radius:16px;padding:17px;background:#faf9fc;overflow:hidden}
.download-box strong{display:block;font-size:17px;margin-bottom:8px}.download-box a{display:inline-block;margin-top:6px;color:#8055c2;font-weight:800;overflow-wrap:anywhere}
@media(max-width:600px){
  body[data-page="recover"] header{position:static}
  body[data-page="recover"] header .nav{min-height:70px;padding:10px 16px;justify-content:flex-start}
  body[data-page="recover"] header .brand{gap:10px}
  body[data-page="recover"] header .logo.warsha-logo{width:46px;height:35px}
  body[data-page="recover"] header .brand span strong{font-size:18px}
  .recover-wrap{margin:20px auto 42px;padding:0 12px}
  .recover-card{padding:18px 14px;border-radius:18px;box-shadow:0 10px 34px rgba(55,35,82,.07)}
  .recover-card h1{font-size:24px}.recover-card>p{font-size:14px;line-height:1.75}
  .recover-card input{font-size:16px;padding:13px 12px}
  .recover-card .btn{width:100%;justify-content:center}
  .downloads{gap:10px;margin-top:18px}.download-box{padding:14px;border-radius:14px}
  .download-box strong{font-size:16px}.download-box a{font-size:14px;line-height:1.6}
}
</style></head><body data-page="recover"><header><div class="container nav"><a class="brand" href="index.html"><div class="logo">WT</div><span><strong>ورشة تك</strong><small>warshaTik</small></span></a></div></header><main class="recover-wrap"><section class="recover-card"><h1>استرجاع مشترياتك</h1><p>إذا اشتريت كضيف، تقدر ترجع ملفاتك بأي وقت باستخدام نفس البريد الإلكتروني المستخدم عند الشراء.</p><div id="step1"><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com"><button class="btn btn-primary" id="sendCode">إرسال رمز التحقق</button><p class="msg" id="msg1"></p></div><div id="step2" hidden><label>رمز التحقق</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"><button class="btn btn-primary" id="verifyCode">عرض مشترياتي</button><p class="msg" id="msg2"></p></div><div class="downloads" id="downloads"></div></section></main><script src="shared.js?v=20261009g"></script><script>const r$=s=>document.querySelector(s);r$('#sendCode').onclick=async()=>{
  const email=r$('#email').value.trim(),btn=r$('#sendCode');
  if(!email){r$('#msg1').textContent='اكتب البريد الإلكتروني أولاً.';return}
  btn.disabled=true;btn.textContent='جاري الإرسال...';r$('#msg1').textContent='';
  try{
    const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),7000);const res=await fetch('/api/recovery/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email}),signal:ctrl.signal});clearTimeout(tm);
    const d=await res.json();
    if(!res.ok)throw new Error(d.reason||d.error||'تعذر إرسال البريد');
    r$('#msg1').textContent=d.message||'إذا كان البريد مرتبطاً بمشتريات، سيصلك رمز.';
    r$('#step2').hidden=false;
  }catch(e){
    r$('#msg1').textContent='❌ '+(e.message||'تعذر الإرسال حالياً.');
  }finally{
    btn.disabled=false;btn.textContent='إرسال رمز التحقق';
  }
};r$('#verifyCode').onclick=async()=>{const email=r$('#email').value.trim(),code=r$('#code').value.trim(),btn=r$('#verifyCode');btn.disabled=true;btn.textContent='جاري التحقق...';r$('#msg2').textContent='';const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{const r=await fetch('/api/recovery/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,code}),signal:ctrl.signal});const d=await r.json();if(!r.ok)throw new Error(d.error||'فشل التحقق');r$('#msg2').textContent='تم التحقق.';r$('#downloads').innerHTML=(d.items||[]).map(it=>`<div class="download-box"><strong>${it.title}</strong>${(it.downloads||[]).length?(it.downloads.map(x=>`<div><a href="${x.url}">تحميل ${x.name}</a></div>`).join('')):'<p>لا يوجد ملف مرفوع لهذا المنتج حالياً.</p>'}</div>`).join('')||'<p>لا توجد مشتريات مدفوعة مرتبطة بهذا البريد.</p>';}catch(e){r$('#msg2').textContent=e.name==='AbortError'?'استغرق التحقق وقتاً أطول من المتوقع. حاول مرة أخرى.':(e.message==='Invalid or expired code'?'الرمز غير صحيح أو انتهت صلاحيته.':e.message)}finally{clearTimeout(timer);btn.disabled=false;btn.textContent='عرض مشترياتي'}};</script></body></html>
