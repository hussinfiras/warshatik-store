<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استرجاع المشتريات | ورشة تك</title><link rel="stylesheet" href="styles.css"><style>.recover-wrap{max-width:720px;margin:80px auto;padding:0 18px}.recover-card{background:#fff;border:1px solid #e7e2eb;border-radius:24px;padding:28px;box-shadow:0 18px 60px rgba(55,35,82,.08)}.recover-card h1{margin-top:0}.recover-card label{display:block;margin:14px 0 6px;font-weight:700}.recover-card input{width:100%;padding:12px;border:1px solid #ddd5e7;border-radius:12px}.recover-card button{margin-top:14px}.msg{margin-top:14px;color:#6f6878}.downloads{margin-top:22px;display:grid;gap:12px}.download-box{border:1px solid #e7e2eb;border-radius:16px;padding:16px;background:#faf9fc}.download-box a{display:inline-block;margin-top:8px;color:#8055c2;font-weight:800}</style></head><body><header><div class="container nav"><a class="brand" href="index.html"><div class="logo">WT</div><span><strong>ورشة تك</strong><small>warshaTik</small></span></a></div></header><main class="recover-wrap"><section class="recover-card"><h1>استرجاع مشترياتك</h1><p>إذا اشتريت كضيف، تقدر ترجع ملفاتك بأي وقت باستخدام نفس البريد الإلكتروني المستخدم عند الشراء.</p><div id="step1"><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com"><button class="btn btn-primary" id="sendCode">إرسال رمز التحقق</button><p class="msg" id="msg1"></p></div><div id="step2" hidden><label>رمز التحقق</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"><button class="btn btn-primary" id="verifyCode">عرض مشترياتي</button><p class="msg" id="msg2"></p></div><div class="downloads" id="downloads"></div></section></main><script>const $=s=>document.querySelector(s);$('#sendCode').onclick=async()=>{const email=$('#email').value.trim();$('#msg1').textContent='جاري الإرسال...';try{const r=await fetch('/api/recovery/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})});const d=await r.json();$('#msg1').textContent=d.message||'إذا كان البريد مرتبطاً بمشتريات، سيصلك رمز.';$('#step2').hidden=false;}catch(e){$('#msg1').textContent='تعذر الإرسال حالياً.'}};$('#verifyCode').onclick=async()=>{const email=$('#email').value.trim(),code=$('#code').value.trim();$('#msg2').textContent='جاري التحقق...';try{const r=await fetch('/api/recovery/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,code})});const d=await r.json();if(!r.ok)throw new Error(d.error||'فشل التحقق');$('#msg2').textContent='تم التحقق.';$('#downloads').innerHTML=(d.items||[]).map(it=>`<div class="download-box"><strong>${it.title}</strong>${(it.downloads||[]).length?(it.downloads.map(x=>`<div><a href="${x.url}">تحميل ${x.name}</a></div>`).join('')):'<p>لا يوجد ملف مرفوع لهذا المنتج حالياً.</p>'}</div>`).join('')||'<p>لا توجد مشتريات مدفوعة مرتبطة بهذا البريد.</p>';}catch(e){$('#msg2').textContent=e.message==='Invalid or expired code'?'الرمز غير صحيح أو انتهت صلاحيته.':e.message}};</script></body></html>
