<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8055c2"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><title>تفاصيل المنتج | ورشة تك</title></head><body data-page="products"><header><div class="container nav"><a class="brand" href="index.html"><div class="logo">WT</div><span><strong>ورشة تك</strong><small>warshaTik</small></span></a><nav class="nav-links" id="navLinks"><a data-page="home" href="index.html">الرئيسية</a><a data-page="courses" href="courses.html">الدورات</a><a data-page="products" href="products.html">المنتجات</a><a data-page="consultations" href="consultations.html">الاستشارات</a></nav><div class="nav-actions"><button class="currency-btn" id="currencyToggle">IQD</button><button class="menu-btn" id="menuButton" aria-label="القائمة"><i></i><i></i><i></i></button></div></div></header><main><section class="section"><div class="container detail-grid" id="detailRoot"></div></section><section class="section rec-section" id="recommendSection" hidden><div class="container"><div class="section-head"><div><span class="kicker">قد يعجبك أيضاً</span><h2>مشاريع ودورات مرتبطة</h2></div></div><div class="cards-grid" id="recommendGrid"></div></div></section></main><footer><div class="container footer-grid"><div><a class="brand" href="index.html"><div class="logo">WT</div><span><strong>ورشة تك</strong><small>warshaTik</small></span></a><p>مشاريع، أكواد ودورات إلكترونيات بالعربي.</p></div><div><strong>روابط</strong><a href="courses.html">الدورات</a><a href="products.html">المنتجات</a><a href="consultations.html">الاستشارات</a><a href="recover.html">استرجاع المشتريات</a></div><div><strong>تواصل</strong><a href="https://t.me/HW2DMbot" target="_blank" rel="noopener">Telegram</a></div></div><div class="container copy">© 2026 ورشة تك | warshaTik — جميع الحقوق محفوظة.</div></footer><script src="products.js"></script><script src="shared.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await window.catalogReady;const storefront=await window.storefrontReady;const p=new URLSearchParams(location.search),id=p.get('id'),type=p.get('type')||'product',all=[...W.products,...W.courses],item=all.find(x=>x.id===id),root=document.getElementById('detailRoot');if(!item){root.innerHTML='<div><h1>المنتج غير موجود</h1><a class="btn btn-primary" href="products.html">الرجوع</a></div>';return}document.title=item.title+' | ورشة تك';const disabled=['sold','coming'].includes(item.status),imgs=(item.images||[]).map(x=>typeof x==='string'?{url:x,name:x}:x).filter(x=>x.url),main=imgs[0]?.url||'';root.innerHTML=`<div class="reveal"><div class="gallery-main" id="mainGallery">${item.statusText?`<span class="${statusClass(item.status)}">${item.statusText}</span>`:''}${main?`<img class="gallery-photo" id="mainProductImage" src="${main}" alt="${item.title}">`:`<div class="big-chip">${item.category.toUpperCase()}</div>`}</div>${imgs.length?`<div class="thumbs">${imgs.map((x,i)=>`<button class="thumb ${i===0?'active':''}" type="button" data-image="${x.url}"><img src="${x.url}" alt="${x.name||item.title}"></button>`).join('')}</div>`:''}${item.youtube?`<div class="video-box"><strong>فيديو / معاينة</strong><p>فيديو توضيحي للمنتج أو الدورة.</p><a href="${item.youtube}" target="_blank" rel="noopener">فتح الفيديو ↗</a></div>`:''}</div><div class="detail reveal"><span class="category">${item.category}</span><h1>${item.title}</h1><p class="desc">${item.description}</p><div class="detail-price">${item.old_price_iqd?`<small class="old-price">${money(item,true)}</small>`:''}${money(item)}</div><ul class="feature-list">${(item.features||[]).map(x=>`<li>${x}</li>`).join('')}</ul>${(item.warningText||storefront.digital_warning_default)?`<div class="digital-warning"><strong>تنبيه</strong><span>${item.warningText||storefront.digital_warning_default}</span></div>`:''}${(item.files||[]).length?`<div class="download-note">يتضمن هذا المنتج ${(item.files||[]).length} ملف/ملفات رقمية. تصبح روابط التحميل متاحة بعد إكمال الدفع.</div>`:''}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px"><button id="addCartBtn" class="btn btn-primary" ${disabled?'disabled style="opacity:.45;cursor:not-allowed"':''}>${disabled?(item.status==='sold'?'غير متوفر حالياً':'قريباً'):'أضف للسلة'}</button><a class="btn btn-ghost" href="${type==='course'?'courses.html':'products.html'}">رجوع</a></div><p id="cartMessage" style="color:#8055c2;font-weight:700;margin-top:12px"></p></div>`;document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{const img=document.getElementById('mainProductImage');if(img)img.src=b.dataset.image;document.querySelectorAll('[data-image]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});const btn=document.getElementById('addCartBtn');if(btn&&!disabled)btn.onclick=()=>{const existed=cartIds().includes(item.id);addToCart(item.id);document.getElementById('cartMessage').innerHTML=existed?'المنتج موجود بالفعل في السلة. <a href="cart.html">فتح السلة ←</a>':'تمت الإضافة إلى السلة. <a href="cart.html">فتح السلة ←</a>';btn.textContent='تمت الإضافة ✓'};const recs=recommendItems([item],3);if(recs.length){document.getElementById('recommendGrid').innerHTML=recommendationCards(recs);document.getElementById('recommendSection').hidden=false;}reveal()});</script></body></html>
